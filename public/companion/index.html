<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e9">
  <title>Masar · Physical AI Lab</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f1e9;color:#303c34;font-family:system-ui,sans-serif;min-height:100dvh}
    header{display:flex;justify-content:space-between;align-items:center;padding:28px 6vw;font-size:12px;color:#737a6e}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}
    main{max-width:1000px;margin:auto;padding:18vh 7vw}h1{font-size:clamp(48px,7vw,76px);font-weight:500;letter-spacing:-.06em;line-height:1.1;margin:0 0 20px}p{font-size:16px;line-height:1.7;color:#737a6e}button{border:0;border-radius:10px;background:#62765c;color:#fcfaf5;padding:14px 22px;font:inherit;cursor:pointer;margin-top:32px}button:hover{background:#4d6348}button:focus-visible,a:focus-visible{outline:2px solid #ad6b54;outline-offset:4px}
  </style>
</head>
<body>
  <header><span>Physical AI Lab</span><a href="https://engbaa.github.io/physical-ai-lab/">Explore the lab ↗</a></header>
  <main><h1>Masar</h1><p>Your lab companion.</p><button id="open-companion">Open conversation ↗</button></main>
  <script type="module" src="./companion.js"></script>
  <script>document.getElementById('open-companion').onclick=()=>document.querySelector('lab-companion')?.open();</script>
</body>
</html>
